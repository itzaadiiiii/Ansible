plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1
filters:
  instance-state-name: running
  "tag:Ansible": "true"
keyed_groups:
  - key: tags.Env
    prefix: env
  - key: tags.Role
    prefix: role
  - key: tags.Project
    prefix: project
hostnames:
  - tag:Name
  - private-ip-address
compose:
  env: tags.Env
  role: tags.Role
  project: tags.Project
