---
- name: Application server remediation
  hosts: app_servers
  become: true
  serial: 1

  vars:
    app_service: myapp
    log_directory: /opt/myapp/logs
    max_log_size_mb: 500

  tasks:

    - name: Check disk usage
      ansible.builtin.shell: |
        df -P / | awk 'NR==2 {print $5}' | tr -d '%'
      register: disk_usage
      changed_when: false

    - name: Display disk usage
      ansible.builtin.debug:
        msg: "Disk usage on {{ inventory_hostname }} is {{ disk_usage.stdout }}%"

    - name: Find large log files
      ansible.builtin.find:
        paths: "{{ log_directory }}"
        patterns: "*.log"
        size: "{{ max_log_size_mb }}m"
        recurse: true
      register: large_logs

    - name: Compress large logs
      community.general.archive:
        path: "{{ item.path }}"
        dest: "{{ item.path }}.gz"
        remove: true
      loop: "{{ large_logs.files }}"
      when: large_logs.files | length > 0

    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_service }}"
        state: restarted
        daemon_reload: true

    - name: Wait for application port
      ansible.builtin.wait_for:
        port: 8080
        host: "{{ inventory_hostname }}"
        delay: 5
        timeout: 60

    - name: Verify application service
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}:8080/actuator/health"
        status_code: 200
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200

    - name: Report successful remediation
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} successfully recovered"
